[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-tutor"
version = "0.0.0"
description = "Course-grounded tutoring agent with evidence-checked answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "fastapi-cli>=0.0.32,<1",
  "langgraph==1.2.18",
  "numpy>=2,<3",
  "openai>=3,<4",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.33,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "langfuse==5.2.0",
]
# Local query embedding. Optional so a checkout without the model stack still
# runs the backend, the tests, and the lexical retrieval arm.
embedding = [
  "torch>=2.6,<3",
  "transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

# Prompt texts are .md files inside verifiable_tutor/prompts/; ship them in
# the wheel so load_prompt works outside an editable install.
[tool.setuptools.package-data]
prompts = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.fastapi]
entrypoint = "verifiable_tutor.api.main:app"
