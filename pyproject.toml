[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-tutor"
version = "0.0.0"
description = "Course-grounded tutoring agent with evidence-checked answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "fastapi-cli>=0.0.32,<1",
  "openai>=3,<4",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.33,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.fastapi]
entrypoint = "verifiable_tutor.api.main:app"
