# Model configuration for verifiable-tutor.
#
# Secrets live only in .env at the repository root (ignored by Git). This file
# is committed and never contains a key: each provider names the environment
# variable that holds its key. Endpoints and model ids follow the provider
# research in docs/model-providers.md, read on 2026-10-29; model ids change
# often, so this file, not the code, is the source of truth.
#
# The primary interactive text-generation path is an external OpenAI-compatible
# API. Qwen on TACC is a required offline text-processing backend for the
# knowledge base (ADR-0011); it is not an OpenAI-compatible provider, and its
# job settings live in config/knowledge.yaml. Embeddings are not an API: BGE-M3
# runs on TACC (see the embedding section) and is loaded by the indexing and
# backend jobs.

defaults:
  timeout_s: 60
  max_retries: 2
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 4096
  # Unified thinking control: off, low, high, or max. See the mapping below.
  thinking: "off"

providers:
  deepseek:
    type: openai_compatible
    # Chat lives at {base_url}/chat/completions; do not append /v1 here.
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # DeepSeek uses max_tokens, range 1 to 393216.
    max_tokens_field: max_tokens
    models:
      # The project uses only the Flash tier on DeepSeek.
      flash: deepseek-flash
    supports:
      image: true
      audio: false
      video: false
      thinking_levels: ["off", low, high, max]
  mimo:
    type: openai_compatible
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    # MiMo uses max_completion_tokens, default and maximum 131072.
    max_tokens_field: max_completion_tokens
    asr_model: mimo-v2.5-asr
    models:
      flash: mimo-v2.6-flash
      pro: mimo-v2.6-pro
    supports:
      image: true
      audio: true
      video: true
      # MiMo has only on and off; low and max degrade to on.
      thinking_levels: ["off", high]

thinking:
  # Unified level -> provider-specific request value.
  mapping:
    deepseek: {"off": none, low: low, high: high, max: max}
    mimo: {"off": disabled, low: enabled, high: enabled, max: enabled}
  # Tool-calling turns disable thinking per provider. DeepSeek accepts tools
  # with thinking as long as tool_choice stays auto; MiMo needs the previous
  # reasoning_content echoed back, so it stays off there by default.
  disable_for_tools:
    deepseek: false
    mimo: true

# Each role picks a provider and a model alias, and may override request
# parameters. Failures retry the same model up to defaults.max_retries; the
# adapter never switches models or providers automatically. When the retries
# are exhausted it raises a user-facing timeout or unavailable message, and
# the user decides when to retry.
roles:
  chat:
    provider: deepseek
    model: flash
    thinking: "off"
    params:
      temperature: 0.0
      max_output_tokens: 4096
  translate_query:
    provider: deepseek
    model: flash
    thinking: "off"
    params:
      temperature: 0.0
      max_output_tokens: 256
  classify_intent:
    provider: mimo
    model: flash
    thinking: "off"
    params:
      temperature: 0.0
      max_output_tokens: 64

# Search always uses the DeepSeek REST APIs, even when the chat model is MiMo.
search:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  search_path: /tools/search
  fetch_path: /tools/fetch
  default_count: 10
  need_content: true
  timeout_s: 30
  max_retries: 2

# Text to speech uses the MiMo TTS family. The user message carries style
# instructions and the assistant message carries the text to speak.
tts:
  provider: mimo
  models:
    default: mimo-v2.5-tts
    voiceclone: mimo-v2.5-tts-voiceclone
    voicedesign: mimo-v2.5-tts-voicedesign
  default_voice: mimo_default
  default_format: wav
  voices: [mimo_default, 冰糖, 茉莉, 苏打, 白桦, Mia, Chloe, Milo, Dean]
  formats: [wav, mp3, pcm, pcm16]
  default_instructions: "Speak clearly with a warm, steady teaching pace."

# External responses are cached by provider, model, parameters, and messages.
# The adapter caches chat, streaming event sequences, ASR, TTS, and
# search/fetch. Keys are content addressed; values are JSON under this
# directory, resolved relative to the repository root (or an explicit
# base_dir). Per-call use_cache=False bypasses the cache, and cache I/O
# failures count as misses. No experiment in the submitted repository may
# require a paid call; the cache makes evaluation runs reproducible and free
# after the first run.
cache:
  enabled: true
  directory: data/caches/model

embedding:
  # Local model, not an API. The weights live in the checkout at models/bge-m3
  # and are gitignored; a relative path resolves against the repository root.
  # The TACC index job keeps its own copy under $HOME/models, configured in
  # config/knowledge.yaml.
  provider: local
  model: BAAI/bge-m3
  model_path: models/bge-m3
  dimension: 1024
  device: cpu
  batch_size: 16
  max_length: 512
