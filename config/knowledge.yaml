# Knowledge-base enrichment configuration.
#
# The local driver (scripts/tacc/run_kb_job.py) reads the model id, prompt
# version, job name, chunk cap and polling values from this file. The TACC job
# runs on the course Qwen environment and is reached only through job
# submission; this file holds no secrets. Record fields are in
# docs/knowledge-schema.md.

job:
  directory: tacc/serve
  name: vt-kb
  partition: tacc
  nodes: 1
  cpus_per_task: 8
  gres: "gpu:2"
  time: "00:59:00"

model:
  name: qwen3.8-27b
  engine: vllm
  tensor_parallel: 2
  max_model_len: 32768
  gpu_memory_utilization: 0.85

build:
  shard: document
  max_chunks_per_job: 80
  prompt_version: kb-v1
  poll_interval_s: 30
  queue_timeout_s: 3600
  request_dir: kb/requests
  result_dir: kb/results

cache:
  directory: data/kb
  key: [corpus_hash, prompt_version, model]
