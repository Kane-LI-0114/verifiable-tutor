entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: vt-index
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:1
    - time=00:59:00
    - output=${TACC_SLURM_USERLOG}/vt-index-%j.log
