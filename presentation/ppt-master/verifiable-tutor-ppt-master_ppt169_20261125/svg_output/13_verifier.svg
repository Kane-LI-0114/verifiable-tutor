  <g id="header" data-pptx-bounds="64 40 1152 132">
    <text x="64" y="64" font-size="21.33" font-weight="bold" fill="#1447E6" letter-spacing="1">12 / VERIFIER</text>
    <text x="64" y="122" font-family="Georgia" font-size="53.33" fill="#09090B">A source is not a citation.</text>
    <text x="64" y="158" font-size="21.33" fill="#52525B">A quoted span must occur on the cited page.</text>
  </g>
  <g id="verifier-steps" data-pptx-bounds="64 184 540 420">
