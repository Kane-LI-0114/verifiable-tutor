    <text x="116" y="220" font-size="21.33" font-weight="bold" fill="#09090B">NORMALIZE</text>
    <text x="116" y="248" font-size="21.33" fill="#18181B">whitespace and case</text>
    <use data-icon="tabler-outline/zoom-scan" x="64" y="290" width="36" height="36" fill="#1447E6" stroke-width="2"/>
    <text x="116" y="306" font-size="21.33" font-weight="bold" fill="#09090B">LOCATE</text>
    <text x="116" y="334" font-size="21.33" fill="#18181B">quoted span on the cited page</text>
    <use data-icon="tabler-outline/git-branch" x="64" y="376" width="36" height="36" fill="#1447E6" stroke-width="2"/>
    <text x="116" y="392" font-size="21.33" font-weight="bold" fill="#09090B">REPAIR ONCE</text>
    <text x="116" y="420" font-size="21.33" fill="#18181B">one bounded retry</text>
