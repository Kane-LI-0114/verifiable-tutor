    <text x="116" y="478" font-size="21.33" font-weight="bold" fill="#09090B">CITATION / ABSTAIN</text>
    <text x="116" y="506" font-size="21.33" fill="#18181B">pass or no answer</text>
    <line x1="64" y1="544" x2="604" y2="544" stroke="#E4E4E7" stroke-width="1"/>
    <text x="64" y="580" font-size="21.33" fill="#52525B">Persisting the verified layer is next.</text>
  </g>
  <g id="verifier-evidence" data-pptx-bounds="640 184 576 420">
