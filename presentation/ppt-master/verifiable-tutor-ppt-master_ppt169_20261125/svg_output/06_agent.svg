    <line x1="120" y1="372" x2="120" y2="416" stroke="#1447E6" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="120" y1="472" x2="120" y2="516" stroke="#1447E6" stroke-width="2" marker-end="url(#arrow)"/>
    <use data-icon="tabler-outline/eye" x="96" y="220" width="48" height="48" fill="#1447E6" stroke-width="2"/>
