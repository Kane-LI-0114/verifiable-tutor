    <text x="168" y="392" font-size="21.33" fill="#18181B">closed tool set</text>
    <use data-icon="tabler-outline/terminal-2" x="96" y="420" width="48" height="48" fill="#1447E6" stroke-width="2"/>
    <text x="168" y="434" font-size="21.33" font-weight="bold" fill="#09090B">EXECUTION</text>
    <text x="168" y="464" font-size="21.33" fill="#18181B">validate arguments</text>
    <text x="168" y="492" font-size="21.33" fill="#18181B">stream results</text>
