  <g id="header" data-pptx-bounds="64 40 1152 132">
    <text x="64" y="64" font-size="21.33" font-weight="bold" fill="#1447E6" letter-spacing="1">05 / FUNCTIONS / AGENT</text>
    <text x="64" y="122" font-family="Georgia" font-size="53.33" fill="#09090B">A typed loop, not a prompt.</text>
    <text x="64" y="158" font-size="21.33" fill="#52525B">Perception, planning, execution, reflection: one closed tool set.</text>
  </g>
