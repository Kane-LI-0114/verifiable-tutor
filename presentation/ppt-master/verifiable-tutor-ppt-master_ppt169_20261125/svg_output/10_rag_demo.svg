<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAFAFA"/>
  <line id="top-rule" data-pptx-role="decoration" x1="64" y1="32" x2="1216" y2="32" stroke="#E4E4E7" stroke-width="1"/>
  <g id="header" data-pptx-bounds="64 40 1152 132">
    <text x="64" y="64" font-size="21.33" font-weight="bold" fill="#1447E6" letter-spacing="1">09 / DEMO / RAG</text>
    <text x="64" y="122" font-family="Georgia" font-size="53.33" fill="#09090B">Every paragraph names its source.</text>
    <text x="64" y="158" font-size="21.33" fill="#52525B">The source pane for one answer: 14 course pages.</text>
  </g>
  <g id="source-pane" data-pptx-bounds="64 184 1152 420">
    <rect x="64" y="190" width="680" height="401" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <image href="../images/ui-rag-source-pane.png" x="64" y="190" width="680" height="401" preserveAspectRatio="xMidYMid meet"/>
    <text x="780" y="226" font-size="21.33" font-weight="bold" fill="#1447E6">14</text>
    <text x="820" y="226" font-size="21.33" fill="#18181B">retrieved pages</text>
    <line x1="780" y1="248" x2="1216" y2="248" stroke="#E4E4E7" stroke-width="1"/>
    <text x="780" y="290" font-size="21.33" font-weight="bold" fill="#09090B">MARKER → PAGE</text>
    <text x="780" y="322" font-size="21.33" fill="#18181B">A marker opens the exact page.</text>
    <text x="780" y="354" font-size="21.33" fill="#18181B">It is not a confidence score.</text>
    <text x="780" y="406" font-size="21.33" font-weight="bold" fill="#09090B">SOURCE ≠ CITATION</text>
    <text x="780" y="438" font-size="21.33" fill="#18181B">Retrieved evidence is not yet</text>
    <text x="780" y="466" font-size="21.33" fill="#18181B">a verified citation.</text>
    <text x="780" y="518" font-size="21.33" font-weight="bold" fill="#09090B">VERIFIER IS NEXT</text>
    <text x="780" y="550" font-size="21.33" fill="#18181B">The span check is a separate</text>
    <text x="780" y="578" font-size="21.33" fill="#18181B">system layer.</text>
  </g>
  <g id="footer" data-pptx-bounds="64 674 1152 38">
